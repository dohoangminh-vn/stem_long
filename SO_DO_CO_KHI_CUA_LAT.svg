<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" width="100%" height="100%" style="background:#0b1329; font-family:'Segoe UI', Arial, sans-serif;">
  <defs>
    <!-- Lưới bản vẽ kỹ thuật CAD -->
    <pattern id="smallGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#172554" stroke-width="0.8"/>
    </pattern>
    <pattern id="grid" width="100" height="100" patternUnits="userSpaceOnUse">
      <rect width="100" height="100" fill="url(#smallGrid)"/>
      <path d="M 100 0 L 0 0 0 100" fill="none" stroke="#1e3a8a" stroke-width="1.2"/>
    </pattern>
    <pattern id="diamondPlate" width="10" height="10" patternUnits="userSpaceOnUse">
      <path d="M 0 5 L 5 0 L 10 5 L 5 10 Z" fill="none" stroke="#94a3b8" stroke-width="0.6"/>
    </pattern>
    <marker id="arrowCyan" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrowYellow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#facc15"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#ef4444"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#22c55e"/>
    </marker>
  </defs>

  <!-- Nền lưới CAD kỹ thuật -->
  <rect width="1200" height="820" fill="url(#grid)"/>
  <rect x="12" y="12" width="1176" height="796" fill="none" stroke="#38bdf8" stroke-width="2"/>

  <!-- TIÊU ĐỀ BẢN VẼ -->
  <rect x="12" y="12" width="1176" height="60" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="30" y="38" fill="#38bdf8" font-size="18" font-weight="bold">BẢN VẼ KỸ THUẬT: CỬA CHỐNG NGẬP THỦY LỰC RAM DỐC HẦM XE (CHUẨN THỰC TẾ VIDEO CÔNG TRÌNH)</text>
  <text x="30" y="60" fill="#94a3b8" font-size="12.5">Đề tài NCKHKT &amp; STEM — THPT Nguyễn Hữu Tiến | Chuẩn hóa theo video thực tế biệt thự cao cấp (Inox 304, 2 rãnh âm sàn, hố thu)</text>
  <text x="1165" y="48" fill="#22c55e" font-size="13.5" font-weight="bold" text-anchor="end">CHUẨN CÔNG TRÌNH BIỆT THỰ CAO CẤP</text>

  <!-- =================================================================================
       PHẦN 1 (BÊN TRÁI): MẶT CẮT KỸ THUẬT DỌC RAM DỐC & 2 RÃNH ÂM SÀN CHỨA XI-LANH
       Gốc bản lề H(0,0) đặt tại (260, 480). Tỉ lệ: 1 mm = 2.6 px.
       X < 260: Máng thử nước ngoài đường. X > 260: Ram dốc hầm xe lát đá có 2 rãnh âm sàn.
       ================================================================================= -->
  <rect x="26" y="84" width="670" height="565" rx="8" fill="rgba(15,23,42,0.88)" stroke="#334155" stroke-width="1.5"/>
  <text x="42" y="110" fill="#38bdf8" font-size="14.5" font-weight="bold">1. MẶT CẮT KỸ THUẬT: CƠ CẤU XI-LANH CHÌM DƯỚI 2 RÃNH ÂM SÀN RAM DỐC</text>

  <!-- Máng thử nước phía ngoài đường (bên trái H) -->
  <rect x="45" y="270" width="205" height="210" fill="rgba(148,163,184,0.12)" stroke="#0ea5e9" stroke-width="1.5" stroke-dasharray="6,4"/>
  <rect x="45" y="320" width="205" height="160" fill="rgba(14,165,233,0.25)"/>
  <text x="145" y="375" fill="#38bdf8" font-size="13" font-weight="bold" text-anchor="middle">MÁNG NƯỚC THỬ NGHIỆM</text>
  <text x="145" y="395" fill="#bae6fd" font-size="11" text-anchor="middle">(Kiểm tra áp lực trước bàn giao)</text>
  <line x1="90" y1="420" x2="246" y2="420" stroke="#0284c7" stroke-width="3.5" marker-end="url(#arrowCyan)"/>
  <text x="165" y="440" fill="#38bdf8" font-size="11" font-weight="bold" text-anchor="middle">Áp lực nước F (chặn 99.9%)</text>

  <!-- Nền ram dốc hầm xe bê tông cốt thép -->
  <path d="M 45 480 L 260 480 L 260 500 L 675 500 L 675 635 L 45 635 Z" fill="#1e293b" stroke="#64748b" stroke-width="1.5"/>
  <!-- Lớp đá granite lát sàn ram dốc (dày 20mm -> 12px) -->
  <rect x="260" y="475" width="415" height="10" fill="#475569" stroke="#94a3b8" stroke-width="1"/>
  <text x="670" y="468" fill="#94a3b8" font-size="11" text-anchor="end">Mặt sàn ram dốc lát đá granite (0°)</text>

  <!-- 2 RÃNH ÂM SÀN CHỮ NHẬT (FLOOR POCKETS) KHOÉT SÂU XUỐNG BÊ TÔNG (X từ 300 đến 550, sâu 39px) -->
  <rect x="300" y="480" width="250" height="38" fill="#0f172a" stroke="#facc15" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="425" y="505" fill="#facc15" font-size="11" font-weight="bold" text-anchor="middle">RÃNH ÂM SÀN CHỮ NHẬT (Chứa xi-lanh khi hạ phẳng)</text>

  <!-- Vách tường hầm ốp đá granite & Đèn LED cảnh báo vàng hổ phách gắn chìm -->
  <rect x="225" y="160" width="25" height="320" fill="rgba(71,85,105,0.4)" stroke="#64748b" stroke-width="1.5"/>
  <rect x="238" y="185" width="8" height="290" rx="3" fill="#ef4444"/>
  <text x="215" y="215" fill="#f87171" font-size="11" font-weight="bold" text-anchor="end">Gioăng cao su EPDM mép vách</text>
  <!-- Đèn LED vàng hổ phách chìm âm tường (Flush Amber LED) -->
  <rect x="232" y="270" width="12" height="30" rx="2" fill="#f59e0b" stroke="#fff" stroke-width="1"/>
  <text x="215" y="288" fill="#fbbf24" font-size="10.5" font-weight="bold" text-anchor="end">Đèn LED vàng chìm</text>

  <!-- TRẠNG THÁI 1: CỬA HẠ PHẲNG HOÀN TOÀN (0°) - Nét đứt vàng -->
  <!-- Tấm cửa Inox gân dài 100mm*2.6 = 260px (từ 260 đến 520), phẳng lì ngang mặt đá granite -->
  <rect x="260" y="465" width="260" height="14" fill="rgba(203,213,225,0.25)" stroke="#facc15" stroke-width="2" stroke-dasharray="6,4"/>
  <!-- Thân xi-lanh và ty lặn hoàn toàn dưới rãnh âm sàn khi cửa hạ phẳng -->
  <line x1="507" y1="500" x2="416" y2="475" stroke="#facc15" stroke-width="4" stroke-dasharray="5,3"/>
  <circle cx="416" cy="475" r="4.5" fill="#facc15"/>
  <text x="416" y="458" fill="#facc15" font-size="10.5" font-weight="bold" text-anchor="middle">Xi-lanh lặn hẳn dưới rãnh khi cửa ở 0°</text>

  <!-- TRẠNG THÁI 2: CỬA DỰNG ĐỨNG VUÔNG GÓC 90° CHẮN NƯỚC (Nét liền sáng rõ) -->
  <!-- Tấm cửa Inox: Mặt ngoài tôn gân quả trám chống trượt, mặt trong dầm hộp -->
  <!-- Tấm Inox gân quả trám mặt trước -->
  <rect x="246" y="220" width="14" height="260" fill="url(#diamondPlate)" stroke="#f8fafc" stroke-width="2"/>
  <rect x="246" y="220" width="14" height="260" fill="rgba(241,245,249,0.1)"/>
  <text x="235" y="350" fill="#e2e8f0" font-size="11" font-weight="bold" transform="rotate(-90 235 350)" text-anchor="middle">INOX 304 GÂN NHÁM QUẢ TRÁM (CHỐNG TRƯỢT XE Ô TÔ)</text>

  <!-- Khung dầm hộp Inox đan lưới mặt sau (hộp 16px) -->
  <rect x="260" y="220" width="14" height="260" fill="#334155" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="260" y="304" width="16" height="20" fill="#475569" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="282" y="240" fill="#ffffff" font-size="12.5" font-weight="bold">Khung dầm hộp chịu lực</text>

  <!-- Tai kẹp chữ U bắt chốt mắt trâu P90 tại Z = 60mm (Y = 480 - 60*2.6 = 324), nhô sau X = +16mm (41px -> X = 260 + 41 = 301) -->
  <polygon points="260,314 260,336 304,330 304,318" fill="#475569" stroke="#94a3b8" stroke-width="2"/>
  <circle cx="301" cy="324" r="6" fill="#38bdf8" stroke="#fff" stroke-width="2"/>
  <text x="314" y="320" fill="#38bdf8" font-size="11.5" font-weight="bold">Khớp mắt trâu P₉₀ (60% chiều cao)</text>

  <!-- GỐI XOAY CHÂN XI-LANH B ĐẶT CHÌM DƯỚI ĐÁY RÃNH ÂM SÀN: X = 95mm (X = 260+247=507), Y = 500 (chìm dưới sàn) -->
  <polygon points="492,510 522,510 514,492 500,492" fill="#1e293b" stroke="#facc15" stroke-width="1.8"/>
  <circle cx="507" cy="498" r="6" fill="#facc15" stroke="#0f172a" stroke-width="2"/>
  <text x="522" y="515" fill="#facc15" font-size="11" font-weight="bold">Gối xoay chìm đáy rãnh B(95, -8 mm)</text>

  <!-- BỘ ĐÔI XI-LANH BEN THỦY LỰC INOX ĐẨY CHÉO LỘ THIÊN KHI CỬA NÂNG -->
  <!-- Thân vỏ xi-lanh ben Inox sáng bóng -->
  <line x1="507" y1="498" x2="394" y2="402" stroke="#475569" stroke-width="16" stroke-linecap="round"/>
  <line x1="507" y1="498" x2="394" y2="402" stroke="#cbd5e1" stroke-width="12" stroke-linecap="round"/>
  <circle cx="394" cy="402" r="8" fill="#64748b" stroke="#cbd5e1" stroke-width="1.5"/>
  <!-- Ty pít-tông Inox mạ crom sáng bóng -->
  <line x1="394" y1="402" x2="301" y2="324" stroke="#f8fafc" stroke-width="6.5" stroke-linecap="round"/>
  <text x="435" y="385" fill="#38bdf8" font-size="12" font-weight="bold">Xi-lanh đẩy chéo Inox 304</text>

  <!-- Cút nối ren 90° & Ống dầu tuy-ô thủy lực chạy chìm dưới rãnh -->
  <path d="M 496 490 Q 515 480 540 500 Q 570 504 620 500" fill="none" stroke="#0f172a" stroke-width="4.5"/>
  <path d="M 496 490 Q 515 480 540 500 Q 570 504 620 500" fill="none" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="560" y="488" fill="#fbbf24" font-size="10.5" font-weight="bold">Tuy-ô dầu cao áp chìm dưới rãnh</text>

  <!-- HỐ THU NƯỚC (SUMP PIT) BÊN HÔNG CÓ 3 CỌC CẢM BIẾN ĐIỆN CỰC INOX (ĐÚNG VIDEO FRAME 27s & 33s) -->
  <rect x="580" y="500" width="80" height="95" fill="#0f172a" stroke="#22c55e" stroke-width="1.8"/>
  <text x="620" y="518" fill="#86efac" font-size="11" font-weight="bold" text-anchor="middle">HỐ THU NƯỚC</text>
  <text x="620" y="534" fill="#94a3b8" font-size="9.5" text-anchor="middle">(Sump Pit)</text>
  <!-- 3 Cọc điện cực cảm biến Inox cắm vào hố thu -->
  <line x1="598" y1="535" x2="598" y2="580" stroke="#f8fafc" stroke-width="2.5"/>
  <line x1="615" y1="535" x2="615" y2="565" stroke="#f8fafc" stroke-width="2.5"/>
  <line x1="632" y1="535" x2="632" y2="550" stroke="#f8fafc" stroke-width="2.5"/>
  <circle cx="598" cy="580" r="3" fill="#ef4444"/>
  <circle cx="615" cy="565" r="3" fill="#facc15"/>
  <circle cx="632" cy="550" r="3" fill="#38bdf8"/>
  <text x="620" y="605" fill="#22c55e" font-size="10" font-weight="bold" text-anchor="middle">3 Cọc cảm biến ngập</text>

  <!-- Tâm bản lề H(0,0) -->
  <circle cx="260" cy="480" r="8" fill="#facc15" stroke="#0f172a" stroke-width="2"/>
  <text x="252" y="502" fill="#facc15" font-size="12" font-weight="bold" text-anchor="end">Bản lề H(0, 0)</text>

  <!-- Ký hiệu góc vuông 90° -->
  <polyline points="262,455 287,455 287,480" fill="none" stroke="#22c55e" stroke-width="2.5"/>
  <circle cx="274" cy="467" r="2.5" fill="#22c55e"/>
  <text x="295" y="465" fill="#22c55e" font-size="13" font-weight="bold">90.0°</text>

  <!-- =================================================================================
       PHẦN 2 (BÊN PHẢI TRÊN): 5 ĐIỂM CHUẨN HÓA KỸ THUẬT RÚT RA TỪ VIDEO THỰC TẾ
       ================================================================================= -->
  <rect x="710" y="84" width="464" height="280" rx="8" fill="rgba(15,23,42,0.88)" stroke="#334155" stroke-width="1.5"/>
  <text x="728" y="110" fill="#facc15" font-size="14" font-weight="bold">2. NĂM ĐIỂM CHUẨN HÓA KỸ THUẬT THEO CÔNG TRÌNH BIỆT THỰ THỰC TẾ</text>

  <text x="728" y="136" fill="#cbd5e1" font-size="11.5"><tspan fill="#38bdf8" font-weight="bold">1. Không dùng máng vàng lộ thiên:</tspan> Sàn ram dốc lát đá granite đồng bộ,</text>
  <text x="738" y="154" fill="#cbd5e1" font-size="11.5">   chỉ khoét <tspan fill="#facc15" font-weight="bold">2 rãnh âm sàn chữ nhật</tspan> để xi-lanh chìm xuống khi hạ phẳng.</text>

  <text x="728" y="176" fill="#cbd5e1" font-size="11.5"><tspan fill="#38bdf8" font-weight="bold">2. Chân xi-lanh chìm đáy rãnh:</tspan> Gối xoay B đặt dưới đáy rãnh âm sàn,</text>
  <text x="738" y="194" fill="#cbd5e1" font-size="11.5">   giúp cửa hạ phẳng 100% không bị cấn, xe ô tô chạy qua êm ái.</text>

  <text x="728" y="216" fill="#cbd5e1" font-size="11.5"><tspan fill="#38bdf8" font-weight="bold">3. Cảm biến hố thu nước (Sump Pit):</tspan> Không treo cảm biến siêu âm</text>
  <text x="738" y="234" fill="#cbd5e1" font-size="11.5">   trên dầm cổng vòm (vướng chiều cao xe). Dùng <tspan fill="#22c55e" font-weight="bold">cọc điện cực Inox hố thu</tspan>.</text>

  <text x="728" y="256" fill="#cbd5e1" font-size="11.5"><tspan fill="#38bdf8" font-weight="bold">4. Cánh cửa Inox 304 gân quả trám:</tspan> Mặt trên dập gân nhám chống trượt</text>
  <text x="738" y="274" fill="#cbd5e1" font-size="11.5">   cho ô tô; mặt dưới là hệ khung dầm hộp đan lưới chịu tải trọng 3–5 tấn.</text>

  <text x="728" y="296" fill="#cbd5e1" font-size="11.5"><tspan fill="#38bdf8" font-weight="bold">5. Đèn cảnh báo chìm âm tường:</tspan> Đèn LED vàng hổ phách gắn chìm</text>
  <text x="738" y="314" fill="#cbd5e1" font-size="11.5">   vào 2 bên vách đá granite, nhấp nháy đồng bộ khi cửa nâng hạ.</text>

  <rect x="726" y="328" width="432" height="26" rx="4" fill="#1e293b" stroke="#22c55e" stroke-width="1"/>
  <text x="942" y="346" fill="#86efac" font-size="11" font-weight="bold" text-anchor="middle">CHUẨN TỌA ĐỘ: B = (95, -8) mm | P(90°) = (16, 60) mm | Hành trình S = 61 mm</text>

  <!-- =================================================================================
       PHẦN 3 (BÊN PHẢI DƯỚI): SƠ ĐỒ NGUYÊN LÝ TỦ ĐIỆN ĐIỀU KHIỂN CHUẨN CÔNG NGHIỆP
       ================================================================================= -->
  <rect x="710" y="376" width="464" height="273" rx="8" fill="rgba(15,23,42,0.88)" stroke="#334155" stroke-width="1.5"/>
  <text x="728" y="402" fill="#38bdf8" font-size="14" font-weight="bold">3. SƠ ĐỒ NGUYÊN LÝ TỦ ĐIỆN ĐIỀU KHIỂN CÔNG NGHIỆP (FRAME 45s VIDEO)</text>

  <!-- Tủ điện có thanh ray DIN-rail -->
  <rect x="728" y="416" width="428" height="220" rx="6" fill="#0f172a" stroke="#64748b" stroke-width="1.2"/>

  <!-- Thanh DIN-rail trên -->
  <line x1="738" y1="465" x2="1146" y2="465" stroke="#94a3b8" stroke-width="3"/>
  <!-- 1. CB tổng Schneider C63 -->
  <rect x="744" y="432" width="38" height="58" rx="2" fill="#1e293b" stroke="#22c55e" stroke-width="1.2"/>
  <text x="763" y="452" fill="#86efac" font-size="8.5" font-weight="bold" text-anchor="middle">CB TỔNG</text>
  <text x="763" y="468" fill="#fff" font-size="8" text-anchor="middle">Schneider</text>
  <!-- 2. CB điều khiển CHINT NXB-63 -->
  <rect x="788" y="432" width="30" height="58" rx="2" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2"/>
  <text x="803" y="452" fill="#38bdf8" font-size="8" font-weight="bold" text-anchor="middle">CB ĐK</text>
  <text x="803" y="468" fill="#fff" font-size="7.5" text-anchor="middle">CHINT</text>
  <!-- 3. Khởi động từ bơm CHINT 40A -->
  <rect x="824" y="432" width="38" height="58" rx="2" fill="#1e293b" stroke="#facc15" stroke-width="1.2"/>
  <text x="843" y="452" fill="#facc15" font-size="8" font-weight="bold" text-anchor="middle">CONTACTOR</text>
  <text x="843" y="468" fill="#fff" font-size="7.5" text-anchor="middle">Bơm dầu</text>
  <!-- 4. Dàn Rơ-le bảo vệ và đảo chiều van thủy lực -->
  <rect x="868" y="432" width="32" height="58" rx="2" fill="#1e293b" stroke="#e2e8f0" stroke-width="1"/>
  <text x="884" y="456" fill="#cbd5e1" font-size="7.5" font-weight="bold" text-anchor="middle">Rơ-le</text>
  <text x="884" y="470" fill="#94a3b8" font-size="7" text-anchor="middle">Bơm</text>
  <rect x="906" y="432" width="32" height="58" rx="2" fill="#1e293b" stroke="#e2e8f0" stroke-width="1"/>
  <text x="922" y="456" fill="#cbd5e1" font-size="7.5" font-weight="bold" text-anchor="middle">Rơ-le</text>
  <text x="922" y="470" fill="#94a3b8" font-size="7" text-anchor="middle">Đóng</text>
  <rect x="944" y="432" width="32" height="58" rx="2" fill="#1e293b" stroke="#e2e8f0" stroke-width="1"/>
  <text x="960" y="456" fill="#cbd5e1" font-size="7.5" font-weight="bold" text-anchor="middle">Rơ-le</text>
  <text x="960" y="470" fill="#94a3b8" font-size="7" text-anchor="middle">Mở</text>
  <!-- 5. Nguồn công nghiệp Mean Well 220V -> 24VDC -->
  <rect x="986" y="426" width="60" height="66" rx="3" fill="#1e293b" stroke="#ef4444" stroke-width="1.5"/>
  <text x="1016" y="448" fill="#fca5a5" font-size="8.5" font-weight="bold" text-anchor="middle">MEAN WELL</text>
  <text x="1016" y="464" fill="#fff" font-size="7.5" text-anchor="middle">DR-60-24</text>
  <text x="1016" y="478" fill="#38bdf8" font-size="7" text-anchor="middle">24V / 2.5A</text>

  <!-- Hàng Rơ-le điều khiển trung tâm phía dưới -->
  <line x1="738" y1="565" x2="1146" y2="565" stroke="#94a3b8" stroke-width="2.5"/>
  <rect x="744" y="520" width="120" height="42" rx="3" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2"/>
  <text x="804" y="538" fill="#38bdf8" font-size="9" font-weight="bold" text-anchor="middle">BỘ XỬ LÝ TRUNG TÂM</text>
  <text x="804" y="552" fill="#94a3b8" font-size="8" text-anchor="middle">ESP8266 / PLC IoT</text>

  <rect x="874" y="520" width="70" height="42" rx="3" fill="#1e293b" stroke="#22c55e" stroke-width="1.2"/>
  <text x="909" y="538" fill="#86efac" font-size="8.5" font-weight="bold" text-anchor="middle">RƠ-LE HỐ THU</text>
  <text x="909" y="552" fill="#cbd5e1" font-size="7.5" text-anchor="middle">Tự kích nâng</text>

  <rect x="954" y="520" width="92" height="42" rx="3" fill="#1e293b" stroke="#facc15" stroke-width="1.2"/>
  <text x="1000" y="538" fill="#facc15" font-size="8.5" font-weight="bold" text-anchor="middle">REMOTE + LUMI</text>
  <text x="1000" y="552" fill="#cbd5e1" font-size="7.5" text-anchor="middle">RF 433MHz / Zigbee</text>

  <!-- Hàng cọc đấu dây Terminal Block dưới đáy tủ -->
  <rect x="738" y="590" width="408" height="34" fill="#1e293b" stroke="#475569" stroke-width="1"/>
