  <text x="44" y="706" fill="#f8fafc" font-size="11.5">• Cánh cửa Inox 304: Mặt ngoài tôn gân nhám quả trám (Diamond plate), mặt trong khung dầm hộp đan lưới chịu lực (100 × 220 × 6 mm).</text>
  <text x="44" y="726" fill="#f8fafc" font-size="11.5">• 2 Rãnh âm sàn ram dốc: Rộng 22 mm, dài 90 mm, sâu 15 mm tại Y = ±75 mm (thân xi-lanh chìm hẳn dưới sàn khi cửa nằm ngang 0°).</text>
  <text x="44" y="746" fill="#f8fafc" font-size="11.5">• Hố thu nước (Sump Pit): Khoét sâu 25 mm ở mép dốc (40 × 40 mm), cắm 3 cọc cảm biến điện cực Inox kích hoạt tự động khi chạm nước.</text>
  <text x="44" y="766" fill="#f8fafc" font-size="11.5">• Đèn cảnh báo: Gắn chìm âm vào 2 vách tường hầm ốp đá granite, chớp nháy màu vàng hổ phách khi cửa chuyển động.</text>

  <text x="700" y="706" fill="#38bdf8" font-size="11.5" font-weight="bold">• File 1: mo_hinh_3d/cua_chan_ngap_90do.stl (Cửa Inox gân + Khung dầm hộp)</text>
  <text x="700" y="726" fill="#38bdf8" font-size="11.5" font-weight="bold">• File 2: mo_hinh_3d/xi_lanh_thuy_luc_bo_doi.stl (2 xi-lanh chìm đáy rãnh + Cút nối)</text>
  <text x="700" y="746" fill="#38bdf8" font-size="11.5" font-weight="bold">• File 3: mo_hinh_3d/khung_ho_am_san_va_tru_cong.stl (Sàn ram dốc 2 rãnh + Hố thu)</text>
